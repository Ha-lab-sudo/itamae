{% extends "base.html" %}

{% block content %}
<h2>避難所登録</h2>
<p>新しい避難所情報を登録します。</p>

<!-- 成功・エラーメッセージ表示 -->
{% if success %}
  <p>{{ message }}</p>
{% endif %}

{% if error %}
  <p>{{ message }}</p>
{% endif %}

<form method="POST">
  <p>
    <label for="name">避難所名（必須）</label><br>
    <input type="text" id="name" name="name" value="{{ registered_name|default('') }}">
  </p>
  <p>
    <label for="address">住所（任意）</label><br>
    <input type="text" id="address" name="address" value="{{ registered_address|default('') }}">
  </p>
  <p>
    <label for="latitude">緯度・経度（距離計算用・任意）</label><br>
    <input type="text" id="latitude" name="latitude" inputmode="decimal" placeholder="緯度" value="{{ registered_latitude|default('') }}">
    <input type="text" id="longitude" name="longitude" inputmode="decimal" placeholder="経度" value="{{ registered_longitude|default('') }}">
  </p>
  <p><button type="submit">登録</button></p>
</form>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<style>
    .search-page { width: min(760px, calc(100% - 22px)); margin: 20px auto 56px; color: #1d2733; }
    .search-panel { padding: 18px 16px 20px; border: 1px solid #dde6f0; border-radius: 16px; background: #fff; box-shadow: 0 8px 22px rgba(31,57,91,.08); }
    .search-heading { margin: 0 0 8px; color: #214d9a; font-size: clamp(1.5rem, 4vw, 2rem); }
    .search-subtitle { margin: 0 0 18px; color: #5d6977; line-height: 1.6; }
    .search-form { display: grid; gap: 18px; }
    .field-group { display: grid; gap: 8px; }
    .field-label { font-weight: 700; }
    .field-select, .field-input { width: 100%; min-height: 48px; padding: 12px 14px; border: 2px solid #c4cedb; border-radius: 10px; font: inherit; color: #1d2733; background: #fff; }
    .checkbox-list { display: grid; gap: 12px; padding: 0; list-style: none; }
    .check-item { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 12px; border: 2px solid #dbe3ee; border-radius: 10px; background: #f8fafc; font-weight: 600; }
    .check-item input { width: 22px; height: 22px; accent-color: #214d9a; }
    .location-tools { display: grid; gap: 8px; padding: 14px; border: 1px solid #dbe3ee; background: #f8fafc; }
    .location-button { min-height: 44px; padding: 9px 14px; border: 2px solid #214d9a; border-radius: 8px; color: #fff; background: #214d9a; font: inherit; font-weight: 700; cursor: pointer; }
    .location-button:disabled { cursor: wait; opacity: .7; }
    .location-status, .location-address, .current-address-note { margin: 0; color: #5d6977; font-size: .9rem; }
    .location-address { color: #1d2733; font-weight: 700; }
    .button-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; }
    .action-button, .ghost-button, .back-link { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 18px; border: 2px solid transparent; border-radius: 10px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    .back-link { border-color: #cad5e2; color: #1d2733; background: #eef4fb; }
    .action-button { color: #fff; background: #214d9a; }
    .ghost-button { border-color: #214d9a; color: #143d7b; background: #fff; }
    .button-spacer { flex: 1; }
    .error-message { padding: 10px 12px; border: 2px solid #d95f5f; border-radius: 10px; color: #a12020; background: #fff1f1; font-weight: 700; }
    .location-permission-dialog { width: min(420px, calc(100% - 32px)); padding: 22px; border: 0; border-radius: 12px; color: #1d2733; box-shadow: 0 16px 40px rgba(31,57,91,.25); }
    .location-permission-dialog::backdrop { background: rgba(14,27,44,.45); }
    .location-dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .location-dialog-actions button { min-height: 42px; padding: 8px 14px; border: 1px solid #214d9a; border-radius: 8px; font: inherit; cursor: pointer; }
    .location-dialog-confirm { color: #fff; background: #214d9a; }
    @media (max-width: 600px) { .search-page { width: calc(100% - 16px); margin-top: 12px; } .button-row { display: grid; } .button-spacer { display: none; } .back-link, .ghost-button, .action-button { width: 100%; } .location-dialog-actions { display: grid; } }
</style>
<div class="search-page"><div class="search-panel">
    <h2 class="search-heading">避難所検索</h2>
    <p class="search-subtitle">現在地を取得すると、避難所を近い順に並べ、徒歩ルートを確認できます。</p>
    {% if error_message %}<div class="error-message" role="alert">{{ error_message }}</div>{% endif %}
    <div class="location-tools">
        <button class="location-button" id="searchLocationButton" type="button" aria-busy="false">現在地を取得してルート案内</button>
        <p class="location-status" id="searchLocationStatus" role="status" aria-live="polite">位置情報は必要なときだけ取得します。</p>
        <p class="location-address" id="searchLocationAddress"></p>
    </div>
    <dialog class="location-permission-dialog" id="locationPermissionDialog" aria-labelledby="locationPermissionTitle">
        <h3 id="locationPermissionTitle">現在地を取得しますか？</h3>
        <p>現在地は距離計算と徒歩ルート案内にだけ使用します。</p>
        <div class="location-dialog-actions"><button id="locationDialogCancel" type="button">今回は取得しない</button><button class="location-dialog-confirm" id="locationDialogConfirm" type="button">取得する</button></div>
    </dialog>
    <form class="search-form" method="get" action="/search_results" novalidate>
        <div class="field-group"><label class="field-label" for="area">エリア <span aria-hidden="true">*</span></label><select class="field-select" id="area" name="area" required aria-required="true"><option value="">選択してください</option><option value="北側" {% if area == '北側' %}selected{% endif %}>北側</option><option value="南側" {% if area == '南側' %}selected{% endif %}>南側</option></select></div>
        <div class="field-group"><label class="field-label" for="district">町名</label><select class="field-select" id="district" name="district"><option value="">選択してください</option></select></div>
        <div class="field-group"><label class="field-label" for="current_address">現在住所</label><input class="field-input" type="text" id="current_address" name="current_address" autocomplete="street-address" placeholder="現在地取得または住所を入力"><p class="current-address-note">現在地取得後は住所が自動入力されます。</p></div>
        <div class="field-group"><span class="field-label">個別条件</span><ul class="checkbox-list"><li class="check-item"><input type="checkbox" id="pet_ok" name="pet_ok" value="1" {% if pet_ok == '1' %}checked{% endif %}><label for="pet_ok">ペット同伴可</label></li><li class="check-item"><input type="checkbox" id="wheelchair_ok" name="wheelchair_ok" value="1" {% if wheelchair_ok == '1' %}checked{% endif %}><label for="wheelchair_ok">車椅子対応可</label></li><li class="check-item"><input type="checkbox" id="multipurpose_toilet" name="multipurpose_toilet" value="1" {% if multipurpose_toilet == '1' %}checked{% endif %}><label for="multipurpose_toilet">多目的トイレあり</label></li></ul></div>
        <div class="button-row"><a class="back-link" href="/">ホームに戻る</a><div class="button-spacer"></div><button class="ghost-button" type="reset" id="resetButton">リセット</button><button class="action-button" type="submit">検索</button></div>
    </form>
</div></div>
<script>
(function () {
    const areaSelect = document.getElementById('area');
    const districtSelect = document.getElementById('district');
    const currentAddress = document.getElementById('current_address');
    const locationButton = document.getElementById('searchLocationButton');
    const locationStatus = document.getElementById('searchLocationStatus');
    const locationAddress = document.getElementById('searchLocationAddress');
    const permissionDialog = document.getElementById('locationPermissionDialog');
    const initialDistrict = {{ district|tojson }};
    const districtMap = {'北側': ['青柳', '安方', '石江', '沖館', '篠田', '新町', '長島', '浪岡', '浜田', '古川', '本町', '三内', '八重田', '矢田前', '柳川'], '南側': ['旭町', '大野', '幸畑', '筒井', '佃', '戸山', '浜田', '松森', '緑', '妙見', '横内', '青柳', '安方', '古川']};
    function updateDistrictOptions() { const choices = districtMap[areaSelect.value] || []; districtSelect.innerHTML = '<option value="">選択してください</option>' + choices.map(function (value) { return '<option value="' + value + '">' + value + '</option>'; }).join(''); districtSelect.value = choices.includes(initialDistrict) ? initialDistrict : ''; }
    function setLocationState(label, busy) { locationButton.textContent = label; locationButton.disabled = busy; locationButton.setAttribute('aria-busy', busy ? 'true' : 'false'); }
    function saveLocation(position) { const location = {latitude: position.coords.latitude, longitude: position.coords.longitude, address: ''}; localStorage.setItem('bousai.currentLocation', JSON.stringify(location)); locationStatus.textContent = '現在地を取得しました。住所を確認しています...'; fetch('/api/reverse-geocode?latitude=' + encodeURIComponent(location.latitude) + '&longitude=' + encodeURIComponent(location.longitude)).then(function (response) { if (!response.ok) throw new Error('住所取得失敗'); return response.json(); }).then(function (data) { if (!data.address) throw new Error('住所取得失敗'); location.address = data.address; currentAddress.value = data.address; locationAddress.textContent = '現在地: ' + data.address; localStorage.setItem('bousai.currentLocation', JSON.stringify(location)); locationStatus.textContent = '現在地を取得しました。検索結果で距離とルート案内を利用できます。'; }).catch(function () { locationStatus.textContent = '現在地を取得しました。住所を確認できないため、距離計算のみ利用できます。'; }).finally(function () { setLocationState('現在地を取得しました', false); }); }
    function acquireLocation() {
        if (!navigator.geolocation) { locationStatus.textContent = 'このブラウザは位置情報に対応していません。'; setLocationState('取得できません', false); return; }
        if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') { locationStatus.textContent = '現在地取得にはHTTPS接続が必要です。'; setLocationState('HTTPSが必要です', false); return; }
        locationStatus.textContent = '現在地を取得しています...'; setLocationState('取得中...', true);
        navigator.geolocation.getCurrentPosition(function (position) { saveLocation(position); }, function (error) { const messages = {}; messages[1] = '位置情報の利用が拒否されています。ブラウザのサイト設定で許可してください。'; messages[2] = '現在地を取得できませんでした。GPSや位置情報サービスを確認してください。'; messages[3] = '現在地の取得がタイムアウトしました。もう一度お試しください。'; locationStatus.textContent = messages[error.code] || '現在地を取得できませんでした。時間をおいて再度お試しください。'; setLocationState('取得に失敗しました', false); }, {enableHighAccuracy: true, timeout: 10000, maximumAge: 0});
    }
    function restoreLocation() { try { const saved = JSON.parse(localStorage.getItem('bousai.currentLocation') || 'null'); if (!saved) return; if (saved.address) { currentAddress.value = saved.address; locationAddress.textContent = '現在地: ' + saved.address; } else if (Number.isFinite(Number(saved.latitude)) && Number.isFinite(Number(saved.longitude))) { locationStatus.textContent = '現在地を利用できます。検索結果に反映されます。'; } } catch (error) { localStorage.removeItem('bousai.currentLocation'); } }
    areaSelect.addEventListener('change', updateDistrictOptions);
    locationButton.addEventListener('click', function () { if (permissionDialog && typeof permissionDialog.showModal === 'function') permissionDialog.showModal(); else acquireLocation(); });
    document.getElementById('locationDialogConfirm').addEventListener('click', function () { permissionDialog.close(); acquireLocation(); });
    document.getElementById('locationDialogCancel').addEventListener('click', function () { permissionDialog.close(); locationStatus.textContent = '位置情報は取得していません。'; });
    document.getElementById('resetButton').addEventListener('click', function () { setTimeout(function () { areaSelect.value = ''; districtSelect.innerHTML = '<option value="">選択してください</option>'; currentAddress.value = ''; localStorage.removeItem('bousai.currentLocation'); }, 0); });
    updateDistrictOptions(); restoreLocation();
    document.querySelector('.search-form').addEventListener('submit', function (event) {
        const existingError = this.querySelector('.validation-error');
        if (existingError) existingError.remove();
        areaSelect.removeAttribute('aria-invalid');
        if (!areaSelect.value) {
            event.preventDefault();
            const errorMessage = document.createElement('p');
            errorMessage.className = 'error-message validation-error';
            errorMessage.setAttribute('role', 'alert');
            errorMessage.textContent = 'エリアを選択してください。';
            this.insertBefore(errorMessage, this.firstElementChild);
            areaSelect.setAttribute('aria-invalid', 'true');
            areaSelect.focus();
        }
    });
}());
</script>
{% endblock %}

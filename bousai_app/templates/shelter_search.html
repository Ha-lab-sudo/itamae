{% extends "base.html" %}

{% block content %}
<style>
	.search-page {
		width: min(980px, calc(100% - 32px));
		margin: 34px auto 70px;
	}

	.search-page h2 { margin: 0 0 12px; color: var(--blue); }
	.search-form {
		display: flex;
		align-items: end;
		gap: 14px;
		margin-top: 26px;
		padding: 22px 24px;
		border-radius: 12px;
		background: var(--surface);
		box-shadow: 0 6px 24px rgba(36, 68, 116, .08);
	}
	.search-form label { display: grid; gap: 7px; font-weight: 700; }
	.search-form input {
		width: min(360px, 65vw);
		padding: 10px 12px;
		border: 1px solid #b8c1cb;
		border-radius: 4px;
		font: inherit;
	}
	.search-button, .all-button {
		display: inline-block;
		padding: 10px 18px;
		border: 1px solid var(--blue);
		border-radius: 4px;
		color: #fff;
		background: var(--blue);
		text-decoration: none;
		cursor: pointer;
		font: inherit;
	}
	.all-button { margin-top: 18px; color: var(--blue); background: #fff; }

	@media (max-width: 600px) {
		.search-page { width: calc(100% - 20px); margin-top: 20px; }
		.search-form { align-items: stretch; flex-direction: column; padding: 18px; }
		.search-form input { width: 100%; }
	}
</style>

<div class="search-page">
	<h2>避難所検索</h2>
	<p>地区名を入力して避難所を検索できます。</p>

	<form class="search-form" action="/search_results" method="get">
		<label for="district">地区名
			<input type="search" id="district" name="district" placeholder="地区名を入力">
		</label>
		<button class="search-button" type="submit">検索</button>
	</form>

	<a class="all-button" href="/all_shelters">全施設一覧</a>
</div>
{% endblock %}
